[project]
# begin_project_name
# DO NOT MODIFY
name = "integration-server-hiring"
# end_project_name
dynamic = ["version"]
dependencies = [
  "UncountablePythonSDK == 0.0.*",
  "mypy == 1.*",
  "ruff == 0.*",
  "openpyxl == 3.*",
  "more_itertools == 10.*",
  "types-paramiko == 3.4.0.20240423",
  "types-openpyxl == 3.*",
  "types-pysftp == 0.*",
  "types-pytz == 2024.*",
  "types-requests == 2.*",
  "types-simplejson == 3.*",
  "pandas-stubs",
  "xlrd == 2.*",
  "uWSGI == 2.0.25.1",
]

[tool.mypy]
strict = true
show_error_codes = true
check_untyped_defs = true
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = true
disallow_untyped_defs = true
implicit_reexport = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
warn_return_any = true
local_partial_types = true
warn_unreachable = false
warn_unused_configs = true
exclude = [
    "env"
]

[tool.ruff]
preview = true
lint.select = ['ALL']
lint.ignore = [
    "builtin-variable-shadowing", # Variable shadows python built-in. Nice to have
    "builtin-argument-shadowing", # Variable shadows python built-in. Nice to have
    "builtin-attribute-shadowing", # Class attribute shadows python built-in. Nice to have
    "ANN",  # Missing type annotations. Skip in favor of mypy
    "ARG",  # Unused arguments. Skip
    "mutable-argument-default", # Do not use mutable data structures for argument defaults. Priority.
    "function-uses-loop-variable", # Function doesn't bind loop variable.  Priority
    "raise-without-from-inside-except", # Exception handling raise from.  Skip
    "BLE", # Blind exception.  Should Add
    "unnecessary-generator-set", # Unecessary generator.  Skip
    "unnecessary-list-comprehension-set", # Unnecessary list comprehension.  Skip
    "unnecessary-literal-set", # Unnecessary list. rewrite as set.  Skip
    "unnecessary-collection-call", # Unnecessary dict call.  Skip
    "unnecessary-comprehension", # Unnecessary list comprehension.  Skip
    "unnecessary-map", # Unnecessary use of map.  Should Add
    "missing-trailing-comma", # Trailing comma.  Too opinionated.  Skip
    "CPY", # Copyright notices.  Skip
    "D",  # Docstrings.  Skip
    "call-datetime-without-tzinfo",  # Missing tzinfo.  Should add
    "call-datetime-today",  # Use of today instead of now.  Should add
    "call-datetime-utcnow",  # Use of utcnow not allowed.  Should add
    "call-datetime-utcfromtimestamp",  # Use of utcfrom timestamp not allowed.  Should add
    "call-datetime-now-without-tzinfo",  # now without tz not allowed.  Should add
    "call-datetime-fromtimestamp",  # use of from timestamp without tz not allowed.  Should add
    "call-datetime-strptime-without-zone",  # replace timezone after strptime.  Should add
    "call-date-today",  # Use of today not allowed.  Should add
    "line-too-long",  # Line length.  Skip
    "raw-string-in-exception", # exception must not use a string literal.  skip
    "f-string-in-exception", # exception must not use an f string.  skip
    "dot-format-in-exception", # exception must not use a format string. skip
    "ERA", # Rules around commented code.  Skip
    "shebang-missing-executable-file", # Executable files need shebang.  Skip
    "unused-variable", # TEMPORARY DISABLE TO CLEAR UP BUILD.  Unused variables.  Prioritize.
    "boolean-type-hint-positional-argument", # boolean positional args.  Skip
    "boolean-default-value-positional-argument", # boolean default positional.  Skip
    "boolean-positional-value-in-call", # boolean positional. Skip
    "line-contains-fixme", # Fixme comment. Skip
    "line-contains-todo", # todo comment.  Skip
    "line-contains-hack", # hack comment.  Skip
    "static-join-to-f-string", # Use F-String instead of join.  Should Add
    "read-whole-file", # replace read function. Skip
    "write-whole-file", # opinionated file opening. Skip
    "repeated-append", # extend vs append.  Skip
    "reimplemented-operator", # opinionated rules about lambdas. skip
    "reimplemented-starmap", # starmap vs generator.  Skip
    "logging-f-string",  # avoid f strings in log statements.  Should add
    "implicit-namespace-package", # implicit imports.  use __init__.  Skip
    "single-line-implicit-string-concatenation", # rule conflicts with formatter. Skip
    "explicit-string-concatenation", # Explicitly concatenated string should be implicitly concatenated. Skip
    "invalid-class-name", # class name case. Skip
    "invalid-function-name", # function name lower case. Skip
    "invalid-argument-name", # argument name lower cas. Skip
    "invalid-first-argument-name-for-class-method", # cls_ first variable.  Should add
    "non-lowercase-variable-in-function", # lower case variable.  Skip
    "lowercase-imported-as-non-lowercase", # case consistency on import.  Skip
    "mixed-case-variable-in-class-scope", # mix casing, skip
    "camelcase-imported-as-acronym", # don't use acronym.  Should add
    "error-suffix-on-exception-name", # exception override should be named with error. should add
    "invalid-module-name", # module naming.  Should add
    "pandas-use-of-inplace-argument", # avoid inplace.  Skip
    "pandas-use-of-dot-not-null", # .notna.  Should add
    "pandas-use-of-dot-pivot-or-unstack", # .pivottable.  Should add
    "pandas-use-of-dot-values", # use .to_numpy.  Skip
    "pandas-use-of-pd-merge", # use .merge.  Should add
    "try-except-in-loop", # avoid try except in loop. Skip
    "manual-list-comprehension", # use list comprehension. Skip
    "manual-list-copy", # use list.copy.  Skip
    "manual-dict-comprehension", # use dictionary comprehension.  Skip
    "suspicious-eval-usage", # avoid eval.  Should add
    "blanket-type-ignore", # ignore specific rules.  Skip
    "blanket-noqa", # ignore specific rules.  Skip
    "useless-import-alias", # import alias doesn't rename. Skip
    "import-outside-top-level", # import at top level.  Skip
    "compare-to-empty-string", # falsy empty string.  Skip
    "comparison-with-itself", # self comparison.  Skip
    "manual-from-import", # alias import.  Skip
    "too-many-return-statements", # too many return statements.  Skip
    "too-many-branches", # too many branches.  Skip
    "too-many-arguments", # too many arguments.  Skip
    "too-many-statements", # too many statements.  Skip
    "too-many-boolean-expressions", # too many expressions. Skip
    "too-many-positional-arguments", # too many positional arguments.  Skip
    "repeated-equality-comparison", # multiple comparisons.  Skip
    "magic-value-comparison", # magic values.  skip
    "collapsible-else-if", # use elif instead of else if.  skip
    "non-augmented-assignment", # use augmented assignment.  confuses strings, wait for fix.  skip
    "literal-membership", # use a set literal for membership test.  skip
    "no-self-use", # method inference.  skip
    "unnecessary-lambda", # inline lambda.  skip
    "useless-else-on-loop", # else without break. skip
    "global-variable-not-assigned", # global withotu assignment.  consider
    "global-statement", # discourage global.  skip
    "subprocess-run-without-check", # subprocess run without check arg.  skip
    "unspecified-encoding", # open without encoding. skip
    "redefined-loop-name", # for loop variable overwritten.  skip
    "pytest-fixture-incorrect-parentheses-style", # change ficture decorator.  should add
    "pytest-raises-too-broad", # use more specific raises decorator.  should add
    "pytest-composite-assertion", # break down complex assertsions.  skip
    "PTH", # enforces new python path library usage.  skip
    "unnecessary-literal-union", # turn union of literals to just literal with multiple. should add
    "redundant-numeric-union", # use float instead of int | float. should remove floats
    "RET", # enforces return semantics. break up and re-evaluate later
    "unnecessary-paren-on-raise-exception", # unnecessary parens on exception.  skip.
    "ambiguous-unicode-character-string", # ambiguous characters.  skip
    "collection-literal-concatenation", # prefer star to concatenation.  skip
    "explicit-f-string-type-conversion", # use explicit conversion flag.  skip
    "mutable-class-default", # type with class var.  should add
    "unnecessary-iterable-allocation-for-first-element", # prefer next for single element. skip
    "unused-noqa", # unused noqa.  should add
    "S", # should split up
    "assert", # allow asserts. skip
    "collapsible-if", # use single if instead of nested. skip
    "suppressible-exception", # use exception supress. skip
    "if-else-block-instead-of-if-exp", # use ternary.  skip
    "reimplemented-builtin", # use any/all.  should add
    "uncapitalized-environment-variables", # case of env variable.  skip
    "if-with-same-arms", # combine if branches.  skip
    "open-file-with-context-handler", # use context handler for files.  should add
    "multiple-with-statements", # use single with.  should add
    "private-member-access", # private member access.  should add
    "no-slots-in-str-subclass", # subclass of string should define slot.  should add
    "print", # print.  skip
    "p-print", # pprint.  skip
    "typing-only-first-party-import", # move application import into type checking.  skip
    "typing-only-third-party-import", # move third party import into type checking.  consider
    "typing-only-standard-library-import", # move library into type checking lbock.  consider
    "TD",  # todo comments.  skip
    "relative-imports", # eliminate relative imports from parents.  skip
    "raise-vanilla-class", # create your own exception. skip
    "raise-vanilla-args", # avoid long messages.  skip
    "type-check-without-type-error", # prefer type error.  should add
    "verbose-raise", # raise without exception name. consider
    "try-consider-else", # move statement to else block.  consider
    "raise-within-try", # move raise to inner function. skip
    "non-pep604-annotation-union", # use union for type annotations.  should add
    "convert-typed-dict-functional-to-class", # eliminate typeddict.  should add
    "printf-string-formatting", # use format specifiers.  should add
    "zip-without-explicit-strict", # zip strict. we have a deprecated pattern here, consider
    "outdated-version-block", # outdated version block, consider
    "zip-instead-of-pairwise", # prefer itertools.pairwise over zip, consider
    "unsorted-dunder-all",  # __all__ is not sorted.  skip due to isort complication
    "datetime-timezone-utc", # use datetime.UTC, TODO add back in
    "deprecated-import", # replacing List with list, TODO add back in
    # ## FROM RUFF UPGRADE
    "import-private-name",  # private name imports.  should add
    "too-many-nested-blocks",  # too many nested blocks -- add with config.  skip
    "unnecessary-dict-comprehension-for-iterable",  # unnecessary dict comprehension.  skip
    "enumerate-for-loop",  # index variable should use enumerate.  should add.
    "too-many-locals"  # too many local variables.  configure below.  should add with config
]
line-length = 90
target-version = "py311"

exclude = [
    'env'
]
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["unused-import"]

[tool.ruff.lint.isort]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 130 # goal would be to bring this down to ~50 or so

[tool.ruff.lint.pylint]
max-locals=50

[tool.setuptools]
py-modules = []

