name: Deploy

on:
    workflow_call:
      inputs:
        ImageTag:
          type: string
          description: Image tag to deploy
    workflow_dispatch:
      inputs:
        ImageTag:
          type: string
          description: Image tag to deploy
jobs:
    deploy:
        # Remove to enable auto deploys
        if: ${{ false }}
        timeout-minutes: 90
        runs-on: ubuntu-latest
        env:
            AWS_REGION: us-west-2
            INSTANCE_ID: INSTANCE_ID_HERE
        steps:
            - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
            - name: Prepare Workflow
              uses: ./.github/actions/prepare_workflow
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN}}

            - name: Set up AWS CLI
              uses: aws-actions/configure-aws-credentials@v1
              with:
                aws-access-key-id: ${{ secrets.AWS_GITHUB_INTEGRATIONS_BUILD_ACCESS_ID }}
                aws-secret-access-key: ${{ secrets.AWS_GITHUB_INTEGRATIONS_BUILD_SECRET }}
                aws-region: ${{ env.AWS_REGION }}

            - name: Run SSM Document
              run: |
                INSTANCE_ID="${{ env.INSTANCE_ID }}"
                IMAGE_TAG="${{ inputs.ImageTag }}"

                # Run the SSM document
                aws ssm send-command \
                  --document-name "integration_server_deploy" \
                  --targets "Key=instanceids,Values=$INSTANCE_ID" \
                  --parameters '{"ImageTag":["'"$IMAGE_TAG"'"]}' \
                  --comment "Running docker-compose up with image tag" \
                  --region ${{ env.AWS_REGION }}
